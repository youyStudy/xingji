# 行迹生产环境 Nginx 配置示例（Windows/Linux 通用，部署时改 root 与端口）
# 作用：托管前端构建产物、把 /api 与 /uploads 反代到 Spring Boot(8080)，页面与接口同源。
# 本地验证：把本文件放到 nginx 的 conf 目录，改 root 指向 xingji-app/dist，启动后访问 8088。

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 前端构建产物多为文本，压缩后体积明显下降
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       8088;
        server_name  localhost;

        # 与后端视频上传上限一致；不设时 Nginx 默认 1MB，上传会直接 413
        client_max_body_size 50m;

        # 前端静态资源（npm run build 的输出目录）
        root   D:/y/develop/03-projects/IdeaProjects/xingji-app/dist;
        index  index.html;

        # 前端是 history 路由，刷新 /me、/trips 时回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 接口反代：proxy_pass 结尾不加 /，保留 /api 前缀原样转发
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            # 会话/行程接口会等待模型返回，默认 60s 会被 nginx 提前截成 504
            proxy_connect_timeout 10s;
            proxy_send_timeout    330s;
            proxy_read_timeout    330s;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 上传的照片/视频同样走同源代理，前端 mediaUrl() 里的 /uploads/... 不用改
        location /uploads/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }

        # 静态资源长缓存；index.html 不缓存，保证发版后能拿到新入口
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public";
        }
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
